services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cliniciq2_db
      POSTGRES_USER: cliniciq2_user
      POSTGRES_PASSWORD: cliniciq2_pass
    ports:
      - "5432:5432"
    volumes:
      - ./dump:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliniciq2_user -d cliniciq2_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://cliniciq2_user:cliniciq2_pass@db:5432/cliniciq2_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app/static:/app/static

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata: